apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auracle.fullname" . }}
  labels:
    {{- include "auracle.labels" . | nindent 4 }}
spec:
  # A second instance would answer every message twice, so run exactly one
  # and stop the old pod before starting a new one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "auracle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "auracle.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auracle
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "discord.existingSecret must name a Secret holding the Discord bot token" .Values.discord.existingSecret }}
                  key: {{ .Values.discord.tokenKey }}
            - name: OLLAMA_URL
              value: {{ .Values.ollama.url | quote }}
            - name: OLLAMA_MODEL
              value: {{ required "ollama.model is required" .Values.ollama.model | quote }}
            - name: DOCS_DIR
              value: /docs
            - name: MAX_HISTORY
              value: {{ .Values.maxHistory | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- with .Values.systemPrompt }}
            - name: SYSTEM_PROMPT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: docs
              mountPath: /docs
              readOnly: true
              {{- with .Values.docs.subPath }}
              subPath: {{ . }}
              {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: docs
          {{- with include "auracle.docsClaim" . }}
          persistentVolumeClaim:
            claimName: {{ . }}
            readOnly: true
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
